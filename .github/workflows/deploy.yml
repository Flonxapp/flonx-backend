name: Build and deploy backend to EC2

# Pull requests are only built (type-check). Deploys happen only on a push to
# main, so code from an unmerged branch can never reach production or its
# secrets.
on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

# never run two deploys at the same time
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # exact versions from package-lock.json; no install scripts from
      # dependencies on CI (only the TypeScript build is needed here)
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          # Optional but recommended: the server's host key line(s), from
          # `ssh-keyscan -H <host>` run once from a trusted machine. Without
          # it the host key is trusted on first use.
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          if [ -n "$EC2_KNOWN_HOSTS" ]; then
            printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          ENV_VARS_JSON: ${{ secrets.ENV_VARS_JSON }}
        run: |
          set -euo pipefail
          TARGET="$EC2_USER@$EC2_HOST"

          ssh "$TARGET" "mkdir -p ~/applications/backend"

          # ship the built app (never local .env files or logs)
          rsync -az \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='logs' \
            . "$TARGET:~/applications/backend/"

          # Write .env from the secret. The JSON is sent over stdin, so
          # values containing quotes or $ can't break the shell command.
          printf '%s' "$ENV_VARS_JSON" | ssh "$TARGET" \
            "umask 077 && jq -r 'to_entries | .[] | \"\(.key)=\(.value)\"' > ~/applications/backend/.env"

          # Production dependencies from the lockfile. Install scripts are
          # disabled; only bcrypt (native module) is rebuilt.
          ssh "$TARGET" "cd ~/applications/backend && npm ci --omit=dev --ignore-scripts && npm rebuild bcrypt"

          # Zero-downtime reload, or first start; then persist the process
          # list so PM2 brings the API back after a reboot.
          ssh "$TARGET" 'command -v pm2 >/dev/null || sudo npm install -g pm2
            cd ~/applications/backend
            if pm2 describe backend >/dev/null 2>&1; then
              pm2 reload backend --update-env
            else
              pm2 start dist/server.js --name backend
            fi
            pm2 save'
